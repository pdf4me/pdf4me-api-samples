service: pdf4me-replace-text-with-image-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
    OUTPUT_BUCKET: ${env:OUTPUT_BUCKET, ''}
    TEXT_TO_REPLACE: ${env:TEXT_TO_REPLACE, '{{LOGO}}'}
    REPLACEMENT_IMAGE_DATA: ${env:REPLACEMENT_IMAGE_DATA, ''}
    REPLACEMENT_IMAGE_NAME: ${env:REPLACEMENT_IMAGE_NAME, 'logo.png'}
    REPLACEMENT_IMAGE_WIDTH: ${env:REPLACEMENT_IMAGE_WIDTH, '100'}
    REPLACEMENT_IMAGE_HEIGHT: ${env:REPLACEMENT_IMAGE_HEIGHT, '50'}
    MAINTAIN_ASPECT_RATIO: ${env:MAINTAIN_ASPECT_RATIO, 'true'}
    OUTPUT_FORMAT: ${env:OUTPUT_FORMAT, 'PNG'}
    QUALITY: ${env:QUALITY, '85'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::${env:INPUT_BUCKET, '*'}"
            - "arn:aws:s3:::${env:OUTPUT_BUCKET, '*'}"
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

functions:
  replaceTextWithImage:
    handler: replace_text_with_image_lambda.handler
    description: Replace text with images using PDF4me API
    timeout: 300
    memorySize: 512
    events:
      - http:
          path: /replace-text-with-image
          method: post
          cors: true
      - s3:
          bucket: ${env:INPUT_BUCKET, 'pdf4me-input-bucket'}
          event: s3:ObjectCreated:*
          existing: true
          rules:
            - suffix: .jpg
            - suffix: .jpeg
            - suffix: .png
            - suffix: .gif
            - suffix: .bmp
            - suffix: .tiff

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true 