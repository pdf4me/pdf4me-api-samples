service: pdf4me-remove-exif-tags-from-image-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
    OUTPUT_BUCKET: ${env:OUTPUT_BUCKET, ''}
    REMOVE_ALL_EXIF: ${env:REMOVE_ALL_EXIF, 'true'}
    PRESERVE_ORIENTATION: ${env:PRESERVE_ORIENTATION, 'false'}
    PRESERVE_COLOR_PROFILE: ${env:PRESERVE_COLOR_PROFILE, 'false'}
    OUTPUT_FORMAT: ${env:OUTPUT_FORMAT, 'PNG'}
    QUALITY: ${env:QUALITY, '85'}
    MAINTAIN_TRANSPARENCY: ${env:MAINTAIN_TRANSPARENCY, 'true'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::${env:INPUT_BUCKET, '*'}"
            - "arn:aws:s3:::${env:OUTPUT_BUCKET, '*'}"
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

functions:
  removeExifTagsFromImage:
    handler: remove_exif_tags_from_image_lambda.handler
    description: Remove EXIF tags from images using PDF4me API
    timeout: 300
    memorySize: 512
    events:
      - http:
          path: /remove-exif-tags-from-image
          method: post
          cors: true
      - s3:
          bucket: ${env:INPUT_BUCKET, 'pdf4me-input-bucket'}
          event: s3:ObjectCreated:*
          existing: true
          rules:
            - suffix: .jpg
            - suffix: .jpeg
            - suffix: .png
            - suffix: .gif
            - suffix: .bmp
            - suffix: .tiff

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true 