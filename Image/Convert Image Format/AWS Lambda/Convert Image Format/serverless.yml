service: pdf4me-convert-image-format-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
    OUTPUT_BUCKET: ${env:OUTPUT_BUCKET, ''}
    OUTPUT_FORMAT: ${env:OUTPUT_FORMAT, 'PNG'}
    QUALITY: ${env:QUALITY, '85'}
    COMPRESSION_LEVEL: ${env:COMPRESSION_LEVEL, '6'}
    MAINTAIN_TRANSPARENCY: ${env:MAINTAIN_TRANSPARENCY, 'true'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::${env:INPUT_BUCKET, '*'}"
            - "arn:aws:s3:::${env:OUTPUT_BUCKET, '*'}"
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

functions:
  convertImageFormat:
    handler: convert_image_format_lambda.handler
    description: Convert image formats using PDF4me API
    timeout: 300
    memorySize: 512
    events:
      - http:
          path: /convert-image-format
          method: post
          cors: true
      - s3:
          bucket: ${env:INPUT_BUCKET, 'pdf4me-input-bucket'}
          event: s3:ObjectCreated:*
          existing: true
          rules:
            - suffix: .jpg
            - suffix: .jpeg
            - suffix: .png
            - suffix: .gif
            - suffix: .bmp
            - suffix: .tiff
            - suffix: .webp

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true 