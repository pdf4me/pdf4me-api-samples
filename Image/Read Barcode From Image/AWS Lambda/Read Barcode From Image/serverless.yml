service: pdf4me-read-barcode-from-image-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
    OUTPUT_BUCKET: ${env:OUTPUT_BUCKET, ''}
    BARCODE_TYPES: ${env:BARCODE_TYPES, 'All'}
    MAX_BARCODES: ${env:MAX_BARCODES, '10'}
    CONFIDENCE: ${env:CONFIDENCE, '0.8'}
    OUTPUT_FORMAT: ${env:OUTPUT_FORMAT, 'JSON'}
    INCLUDE_BARCODE_IMAGE: ${env:INCLUDE_BARCODE_IMAGE, 'false'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::${env:INPUT_BUCKET, '*'}"
            - "arn:aws:s3:::${env:OUTPUT_BUCKET, '*'}"
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

functions:
  readBarcodeFromImage:
    handler: read_barcode_from_image_lambda.handler
    description: Read barcodes from images using PDF4me API
    timeout: 300
    memorySize: 512
    events:
      - http:
          path: /read-barcode-from-image
          method: post
          cors: true
      - s3:
          bucket: ${env:INPUT_BUCKET, 'pdf4me-input-bucket'}
          event: s3:ObjectCreated:*
          existing: true
          rules:
            - suffix: .jpg
            - suffix: .jpeg
            - suffix: .png
            - suffix: .gif
            - suffix: .bmp
            - suffix: .tiff

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true 