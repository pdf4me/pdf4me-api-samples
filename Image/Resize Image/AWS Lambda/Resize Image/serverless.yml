service: pdf4me-resize-image-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
    OUTPUT_BUCKET: ${env:OUTPUT_BUCKET, ''}
    WIDTH: ${env:WIDTH, '800'}
    HEIGHT: ${env:HEIGHT, '600'}
    MAINTAIN_ASPECT_RATIO: ${env:MAINTAIN_ASPECT_RATIO, 'true'}
    RESIZE_MODE: ${env:RESIZE_MODE, 'Fit'}
    BACKGROUND_COLOR: ${env:BACKGROUND_COLOR, '#FFFFFF'}
    OUTPUT_FORMAT: ${env:OUTPUT_FORMAT, 'PNG'}
    QUALITY: ${env:QUALITY, '85'}
    MAINTAIN_TRANSPARENCY: ${env:MAINTAIN_TRANSPARENCY, 'true'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::${env:INPUT_BUCKET, '*'}"
            - "arn:aws:s3:::${env:OUTPUT_BUCKET, '*'}"
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

functions:
  resizeImage:
    handler: resize_image_lambda.handler
    description: Resize images using PDF4me API
    timeout: 300
    memorySize: 512
    events:
      - http:
          path: /resize-image
          method: post
          cors: true
      - s3:
          bucket: ${env:INPUT_BUCKET, 'pdf4me-input-bucket'}
          event: s3:ObjectCreated:*
          existing: true
          rules:
            - suffix: .jpg
            - suffix: .jpeg
            - suffix: .png
            - suffix: .gif
            - suffix: .bmp
            - suffix: .tiff

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true 