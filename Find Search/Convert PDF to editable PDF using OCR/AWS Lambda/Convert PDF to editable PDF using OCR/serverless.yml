service: convert-pdf-to-editable-pdf-using-ocr-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::convertpdfocr-input-bucket/*"
            - "arn:aws:s3:::convertpdfocr-output-bucket/*"

functions:
  convertPdfToEditablePdfUsingOcr:
    handler: convert_pdf_to_editable_pdf_using_ocr_lambda.handler
    events:
      - httpApi:
          path: /convert-pdf-to-editable-pdf-using-ocr
          method: POST
      - s3:
          bucket: convertpdfocr-input-bucket
          event: s3:ObjectCreated:*
          existing: true
    environment:
      OUTPUT_BUCKET: convertpdfocr-output-bucket

resources:
  Resources:
    ConvertPdfOcrInputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: convertpdfocr-input-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    ConvertPdfOcrOutputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: convertpdfocr-output-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

plugins:
  - serverless-offline 