service: convert-to-pdf-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::convert-to-pdf-input-bucket/*"
            - "arn:aws:s3:::convert-to-pdf-output-bucket/*"

functions:
  convertToPdf:
    handler: convert_to_pdf_lambda.handler
    events:
      - httpApi:
          path: /convert-to-pdf
          method: POST
      - s3:
          bucket: convert-to-pdf-input-bucket
          event: s3:ObjectCreated:*
          existing: true
    environment:
      OUTPUT_BUCKET: convert-to-pdf-output-bucket

resources:
  Resources:
    ConvertToPdfInputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: convert-to-pdf-input-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    ConvertToPdfOutputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: convert-to-pdf-output-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

plugins:
  - serverless-offline 