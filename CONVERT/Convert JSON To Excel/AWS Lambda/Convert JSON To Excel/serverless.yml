service: convert-json-to-excel-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::convertjsontoexcel-input-bucket/*"
            - "arn:aws:s3:::convertjsontoexcel-output-bucket/*"

functions:
  convertJsonToExcel:
    handler: convertJsonToExcel_lambda.handler
    events:
      - httpApi:
          path: /convert-json-to-excel
          method: POST
      - s3:
          bucket: convertjsontoexcel-input-bucket
          event: s3:ObjectCreated:*
          existing: true
    environment:
      OUTPUT_BUCKET: convertjsontoexcel-output-bucket

resources:
  Resources:
    ConvertJsonToExcelInputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: convertjsontoexcel-input-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    ConvertJsonToExcelOutputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: convertjsontoexcel-output-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

plugins:
  - serverless-offline