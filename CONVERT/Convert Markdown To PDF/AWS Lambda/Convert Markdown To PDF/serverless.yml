service: convert-markdown-to-pdf-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::convertmarkdowntopdf-input-bucket/*"
            - "arn:aws:s3:::convertmarkdowntopdf-output-bucket/*"

functions:
  convertMarkdownToPdf:
    handler: convertMarkdownToPdf_lambda.handler
    events:
      - httpApi:
          path: /convert-markdown-to-pdf
          method: POST
      - s3:
          bucket: convertmarkdowntopdf-input-bucket
          event: s3:ObjectCreated:*
          existing: true
    environment:
      OUTPUT_BUCKET: convertmarkdowntopdf-output-bucket

resources:
  Resources:
    ConvertMarkdownToPdfInputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: convertmarkdowntopdf-input-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    ConvertMarkdownToPdfOutputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: convertmarkdowntopdf-output-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

plugins:
  - serverless-offline