service: convert-word-to-pdf-form-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::convertwordtopdfform-input-bucket/*"
            - "arn:aws:s3:::convertwordtopdfform-output-bucket/*"

functions:
  convertWordToPdfForm:
    handler: convertWordToPdfForm_lambda.handler
    events:
      - httpApi:
          path: /convert-word-to-pdf-form
          method: POST
      - s3:
          bucket: convertwordtopdfform-input-bucket
          event: s3:ObjectCreated:*
          existing: true
    environment:
      OUTPUT_BUCKET: convertwordtopdfform-output-bucket

resources:
  Resources:
    ConvertWordToPdfFormInputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: convertwordtopdfform-input-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    ConvertWordToPdfFormOutputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: convertwordtopdfform-output-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

plugins:
  - serverless-offline