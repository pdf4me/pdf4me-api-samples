service: create-pdfa-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::createpdfa-input-bucket/*"
            - "arn:aws:s3:::createpdfa-output-bucket/*"

functions:
  createPdfA:
    handler: createPdfA_lambda.handler
    events:
      - httpApi:
          path: /create-pdfa
          method: POST
      - s3:
          bucket: createpdfa-input-bucket
          event: s3:ObjectCreated:*
          existing: true
    environment:
      OUTPUT_BUCKET: createpdfa-output-bucket

resources:
  Resources:
    CreatePdfAInputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: createpdfa-input-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    CreatePdfAOutputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: createpdfa-output-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

plugins:
  - serverless-offline