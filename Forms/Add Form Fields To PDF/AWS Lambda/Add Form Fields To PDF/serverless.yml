service: add-form-fields-to-pdf-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::addformfields-input-bucket/*"
            - "arn:aws:s3:::addformfields-output-bucket/*"

functions:
  addFormFieldsToPdf:
    handler: add_form_fields_to_pdf_lambda.handler
    events:
      - httpApi:
          path: /add-form-fields-to-pdf
          method: POST
      - s3:
          bucket: addformfields-input-bucket
          event: s3:ObjectCreated:*
          existing: true
    environment:
      OUTPUT_BUCKET: addformfields-output-bucket

resources:
  Resources:
    AddFormFieldsInputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: addformfields-input-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    AddFormFieldsOutputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: addformfields-output-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

plugins:
  - serverless-offline 