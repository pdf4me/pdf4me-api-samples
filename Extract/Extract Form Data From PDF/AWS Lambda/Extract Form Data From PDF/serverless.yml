service: extract-form-data-from-pdf-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::extractformdata-input-bucket/*"
            - "arn:aws:s3:::extractformdata-output-bucket/*"

functions:
  extractFormDataFromPdf:
    handler: extract_form_data_from_pdf_lambda.handler
    events:
      - httpApi:
          path: /extract-form-data-from-pdf
          method: POST
      - s3:
          bucket: extractformdata-input-bucket
          event: s3:ObjectCreated:*
          existing: true
    environment:
      OUTPUT_BUCKET: extractformdata-output-bucket

resources:
  Resources:
    ExtractFormDataInputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: extractformdata-input-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    ExtractFormDataOutputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: extractformdata-output-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

plugins:
  - serverless-offline 