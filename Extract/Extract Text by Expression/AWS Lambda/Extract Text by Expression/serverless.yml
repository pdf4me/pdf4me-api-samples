service: extract-text-by-expression-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::extracttext-input-bucket/*"
            - "arn:aws:s3:::extracttext-output-bucket/*"

functions:
  extractTextByExpression:
    handler: extract_text_by_expression_lambda.handler
    events:
      - httpApi:
          path: /extract-text-by-expression
          method: POST
      - s3:
          bucket: extracttext-input-bucket
          event: s3:ObjectCreated:*
          existing: true
    environment:
      OUTPUT_BUCKET: extracttext-output-bucket

resources:
  Resources:
    ExtractTextInputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: extracttext-input-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    ExtractTextOutputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: extracttext-output-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

plugins:
  - serverless-offline 