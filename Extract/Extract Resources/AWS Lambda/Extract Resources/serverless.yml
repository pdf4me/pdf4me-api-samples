service: extract-resources-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::extractresources-input-bucket/*"
            - "arn:aws:s3:::extractresources-output-bucket/*"

functions:
  extractResources:
    handler: extract_resources_lambda.handler
    events:
      - httpApi:
          path: /extract-resources
          method: POST
      - s3:
          bucket: extractresources-input-bucket
          event: s3:ObjectCreated:*
          existing: true
    environment:
      OUTPUT_BUCKET: extractresources-output-bucket

resources:
  Resources:
    ExtractResourcesInputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: extractresources-input-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    ExtractResourcesOutputBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: extractresources-output-bucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

plugins:
  - serverless-offline 