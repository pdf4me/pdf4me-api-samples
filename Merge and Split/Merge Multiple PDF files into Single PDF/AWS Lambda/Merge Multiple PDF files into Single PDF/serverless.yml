service: merge-multiple-pdf-files-into-single-pdf

provider:
  name: aws
  runtime: nodejs14.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
    OUTPUT_S3_BUCKET: ${env:OUTPUT_S3_BUCKET}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource: 
        - "arn:aws:s3:::${env:OUTPUT_S3_BUCKET}/*"
        - "arn:aws:s3:::${env:INPUT_S3_BUCKET}/*"

functions:
  mergeMultiplePdfFiles:
    handler: merge_multiple_pdf_files_into_single_pdf_lambda.handler
    name: merge-multiple-pdf-files-into-single-pdf
    description: Merge multiple PDF files into a single PDF using PDF4me API
    memorySize: 512
    timeout: 300
    events:
      - http:
          path: merge-pdfs
          method: post
          cors: true
      - schedule:
          rate: rate(1 day)
          enabled: false
    environment:
      PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
      OUTPUT_S3_BUCKET: ${env:OUTPUT_S3_BUCKET}

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true 