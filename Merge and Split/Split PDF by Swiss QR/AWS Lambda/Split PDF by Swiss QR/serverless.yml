service: split-pdf-by-swiss-qr

provider:
  name: aws
  runtime: nodejs14.x
  region: us-east-1
  environment:
    PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
    OUTPUT_S3_BUCKET: ${env:OUTPUT_S3_BUCKET}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource: 
        - "arn:aws:s3:::${env:OUTPUT_S3_BUCKET}/*"
        - "arn:aws:s3:::${env:INPUT_S3_BUCKET}/*"

functions:
  splitPdfBySwissQR:
    handler: split_pdf_by_swiss_qr_lambda.handler
    name: split-pdf-by-swiss-qr
    description: Split PDF documents by Swiss QR using PDF4me API
    memorySize: 512
    timeout: 300
    events:
      - http:
          path: split-pdf-by-swiss-qr
          method: post
          cors: true
    environment:
      PDF4ME_API_KEY: ${env:PDF4ME_API_KEY}
      OUTPUT_S3_BUCKET: ${env:OUTPUT_S3_BUCKET}

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true 